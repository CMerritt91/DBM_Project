<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Kaushan+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title th:text="${title}"></title>
</head>

<nav th:fragment="nav" class="mainnav navbar navbar-expand-lg p-0" style="font-family: 'Kaushan Script', cursive">
    <div class="ps-3 align-items-baseline">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="nav-links navbar-nav">
                <li class="nav-item">
                    <a class="nav-link fs-5" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item" >
                    <a class="nav-link fs-5" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" >
                    <a class="nav-link fs-5" th:href="@{/gallery}">Gallery</a>
                </li>
                <li class="nav-item" >
                    <a class="nav-link fs-5" th:href="@{/user}">Profile</a>
                </li>
                <li class="nav-item" >
                    <form th:action="@{/logout}" th:method="post">
                        <button class="border border-0 nav-link fs-5" style="background-color: aliceblue">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer"></footer>
<th:block th:fragment="scripts">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</th:block>

</html>
