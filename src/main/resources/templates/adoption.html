<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{partials :: head('Adopt')}"></head>

<body>
    <nav th:replace="~{partials :: nav}"></nav>

    <div class="container my-4" style="max-width: 800px;">
        <h2 class="text-center mb-4">Adoption Application</h2>

        <form th:action="@{/adoption}" method="post">
            <input type="hidden" name="petId" th:value="${pet.petId}">

            <!--pet information-->
            <div class="card mb-4 shadow-sm">
                <div class="row g-0">
                    <div class="col-4">
                        <img th:src="@{'/img/' + ${pet.photoUrl}}" th:alt="${pet.name}"
                             class="w-100 h-100 object-fit-cover rounded-start">
                    </div>
                    <div class="col-8">
                        <div class="card-body">
                            <h5 class="card-title">Pet Information</h5>
                            <label class="form-label small mb-0">Name</label>
                            <input class="form-control mb-2" type="text" th:value="${pet.name}" readonly>
                            <div class="row">
                                <div class="col">
                                    <label class="form-label small mb-0">Breed</label>
                                    <input class="form-control" type="text" th:value="${breedName}" readonly>
                                </div>
                                <div class="col">
                                    <label class="form-label small mb-0">Sex</label>
                                    <input class="form-control" type="text" th:value="${pet.sex}" readonly>
                                </div>
                                <div class="col">
                                    <label class="form-label small mb-0">Age</label>
                                    <input class="form-control" type="text" th:value="${pet.getAgeInYears}" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!--applicant information-->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Your Information</h5>
                    <div class="row">
                        <div class="col">
                            <label class="form-label small mb-0">First Name</label>
                            <input class="form-control mb-2" type="text" th:value="${user.firstName}" readonly>
                        </div>
                        <div class="col">
                            <label class="form-label small mb-0">Last Name</label>
                            <input class="form-control mb-2" type="text" th:value="${user.lastName}" readonly>
                        </div>
                    </div>
                    <label class="form-label small mb-0">Email</label>
                    <input class="form-control mb-2" type="text" th:value="${user.email}" readonly>
                    <label class="form-label small mb-0">Address</label>
                    <input class="form-control mb-2" type="text" th:value="${user.address}" readonly>
                    <label class="form-label small mb-0">Phone Number</label>
                    <input class="form-control" type="text" th:value="${user.phoneNumber}" readonly>
                    <p class="small text-muted mt-2 mb-0">Wrong details? Update them from your account page first.</p>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a class="btn btn-outline-secondary" th:href="@{/pet/{id}(id=${pet.petId})}">Cancel</a>
                <button type="submit" class="btn btn-secondary">Submit Application</button>
            </div>
        </form>
    </div>

    <th:block th:replace="~{partials :: scripts}"></th:block>
</body>

</html>
