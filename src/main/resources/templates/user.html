<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{partials :: head('My Account')}"></head>

<body>
    <nav th:replace="~{partials :: nav}"></nav>

    <div class="container my-4">

        <!--greeting-->
        <h2 class="text-center mb-4" th:text="'Welcome, ' + ${firstName} + '!'">Welcome!</h2>

        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <!--action buttons-->
        <div class="d-flex flex-wrap justify-content-center gap-3 mb-5">

            <button type="button" class="btn btn-secondary" th:unless="${isVolunteer}"
                data-bs-toggle="modal" data-bs-target="#volunteerModal">
                Become a Volunteer
            </button>
            <span class="btn btn-success disabled" th:if="${isVolunteer}">You're a Volunteer</span>

            <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#editModal">
                Update My Information
            </button>

            <a class="btn btn-secondary" th:href="@{/gallery}">Adopt an Animal</a>
        </div>

        <!--adopted pets-->
        <h4 class="text-center mb-3">My Adopted Pets</h4>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="p : ${adoptedPets}">
                <div class="card h-100 shadow-sm">
                    <div class="row g-0 h-100">
                        <div class="col-4">
                            <img th:src="@{'/img/' + ${p.photoUrl}}" th:alt="${p.name}"
                                 class="w-100 h-100 object-fit-cover rounded-start">
                        </div>
                        <div class="col-8">
                            <div class="card-body">
                                <h5 class="card-title border-bottom border-3" style="border-color: coral;"
                                    th:text="${p.name}">Name</h5>
                                <!--<p class="card-text small text-muted mb-1" th:text="${pet.ageInYears} + ' years old'">2 years old</p> -->
                                <p class="card-text small text-muted mb-2" th:text="${p.sex}">Sex</p>
                                <a th:href="@{/pet/{id}(id=${p.petId})}" class="btn btn-secondary btn-sm">View</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${#lists.isEmpty(adoptedPets)}">
                <p class="text-center text-muted">You haven't adopted a pet yet. Use "Adopt an Animal" to find one.</p>
            </div>
        </div>
    </div>

    <!--Modal for updating users-->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/user/update}" th:object="${user}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">Update My Information</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <div class="row">
                            <div class="col">
                                <label class="form-label" for="firstName">First Name</label>
                                <input class="form-control" type="text" th:field="*{firstName}" required>
                            </div>
                            <div class="col">
                                <label class="form-label" for="lastName">Last Name</label>
                                <input class="form-control" type="text" th:field="*{lastName}" required>
                            </div>
                        </div>

                        <label class="form-label pt-2" for="email">Email</label>
                        <input class="form-control" type="email" th:field="*{email}" readonly>

                        <label class="form-label pt-2" for="address">Address</label>
                        <input class="form-control" type="text" th:field="*{address}">

                        <label class="form-label pt-2" for="phoneNumber">Phone Number</label>
                        <input class="form-control" type="tel" th:field="*{phoneNumber}">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-secondary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="volunteerModal" tabindex="-1" aria-labelledby="volunteerModalLabel">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <form th:action="@{/user/volunteer}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="volunteerModalLabel">Volunteer</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <label class="form-label" for="availability">When are you available?</label>
                        <textarea class="form-control" id="availability" name="availability" rows="3"
                              maxlength="250" required
                              placeholder="e.g. Saturdays 9am-1pm"></textarea>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-secondary">Sign Me Up</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block th:replace="~{partials :: scripts}"></th:block>
</body>

</html>
