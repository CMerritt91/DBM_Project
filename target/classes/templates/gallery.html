<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{partials :: head('Gallery')}"></head>
    
    <body>
      <nav th:replace="~{partials :: nav}"></nav>

      <div class="container my-4">
        <h2 class="text-center mb-4">Gallery</h2>

        <form class="row g-2 justify-content-center mb-4" th:action="@{/gallery}" method="get">
          <div class="col-12 col-sm-6 col-md-3">
            <select class="form-select" name="species">
              <option value="">All species</option>
              <option th:each="e : ${speciesNames}" th:value="${e.key}" th:text="${e.value}"
                th:selected="${e.key == species}"></option>
            </select>
          </div>
          <div class="col-12 col-sm-6 col-md-3">
            <select class="form-select" name="breed">
              <option value="">All breeds</option>
              <option th:each="e : ${breedNames}" th:value="${e.key}" th:text="${e.value}"
                th:selected="${e.key == breed}"></option>
            </select>
          </div>
          <div class="col-12 col-sm-6 col-md-3">
            <select class="form-select" name="sex">
              <option value="">Any sex</option>
              <option value="Male" th:selected="${sex == 'Male'}">Male</option>
              <option value="Female" th:selected="${sex == 'Female'}">Female</option>
            </select>
          </div>
          <div class="col-12 col-sm-6 col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-secondary flex-fill">Filter</button>
            <a th:href="@{/gallery}" class="btn btn-outline-secondary flex-fill">Clear</a>
          </div>
        </form>

        <p class="text-center text-muted" th:text="${total} + ' pets found'">0 pets found</p>

        <div class="h2 row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 pb-3">
          <div class="col" th:each="p : ${pets}">
            <div class="card h-100 shadow-sm">
              <div class="row g-0 h-100">
                <div class="col-4">
                  <img th:src="@{'/img/' + ${p.photoUrl}}" th:alt="${p.name}"
                  class="w-100 h-100 object-fit-cover rounded-start" style="min-height: 180px;">
                </div>
                <div class="col-8">
                  <div class="card-body d-flex flex-column h-100">
                    <h4 class="card-title border-bottom border-3" style="border-color: coral;" th:text="${p.name}">Name</h4>
                      <p class="card-text small text-muted mb-1" th:text="${breedNames[p.breedId]}">Breed</p>
                      <p class="card-text small text-muted mb-1" th:text="${p.getAgeInYears} + ' years old'">2 years old</p>
                      <p class="card-text small text-muted mb-1" th:text="${p.sex}">Unknown</p>
                      <p class="card-text" th:text="${p.description}">Description</p>
                      <a th:href="@{/pet/{id}(id=${p.petId})}"
                        class="btn btn-secondary btn-sm mt-auto align-self-start">Learn more</a>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12" th:if="${#lists.isEmpty(pets)}">
            <p class="text-center text-muted">No pets available right now.</p>
          </div>
        </div>

        <!--page buttons-->
        <nav class="d-flex justify-content-between align-items-center my-4">
          <a class="btn btn-secondary"
            th:classappend="${currentPage <= 1} ? 'disabled'"
            th:href="@{/gallery(page=${currentPage - 1}, species=${species}, breed=${breed}, sex=${sex})}">Previous</a>

          <span th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}">Page 1 of 1</span>

          <a class="btn btn-secondary"
            th:classappend="${currentPage >= totalPages} ? 'disabled'"
            th:href="@{/gallery(page=${currentPage + 1}, species=${species}, breed=${breed}, sex=${sex})}">Next</a>

        </nav>
      </div>
      
      <block th:replace="~{partials :: scripts}"></block>

    </body>
</html>
