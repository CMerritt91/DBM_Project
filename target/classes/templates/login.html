<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{partials :: head('Login')}"></head>

<body>
    <!--navbar-->
    <nav th:replace="~{partials :: nav}"></nav>
    <div class="ghost"></div>
        <!--container for login-->
    <div class="container">
        <div>
            <h1 class="formTitle text-center text-light">Login</h1>
        </div>
        <div class="container rounded formBody w-50">
            <h6 class="pt-2 text-center">Please Enter Username and ID</h6>

            <p class="text-danger"  th:if="${param.error}">Invalid email or password.</p>
            <p class="text-success" th:if="${param.logout}">You have been logged out.</p>
            <p class="text-success" th:if="${param.registered}">Account created. Please log in.</p>

            <form th:action="@{/login}" method="post" class="container p-2">
                <label for="username" class="form-label pt-1">Email</label>
                <input class="form-control" type="text" name="username" id="username" >

                <label for="password" class="form-label pt-1">Password</label>
                <input class="form-control" type="password" name="password" id="password" >
                
                <div class="pt-2 d-grid my-1">
                    <button class="formBtn border border-light">Login</button>
                </div>
            </form>
        </div>
    </div>
    <block th:replace="~{partials :: scripts}"></block>
</body>
<footer></footer>

</html>
