<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{partials :: head('Home')}"></head>

<body>
    <nav th:replace="~{partials :: nav}"></nav>
    <!--container for intro-->
    <div class="h1 container-md-fluid rounded">
        <div class="col-6 d-flex justify-content-center align-items-center">
            <p class="text-center">Complete your family today</p>
        </div>
        <img th:src="@{/img/group_dogs.png}" class="img-fluid col-6 rounded">
    </div>
    <!--label for gallery-->
    <div class="h3 container-md-fluid rounded d-flex justify-content-center py-2">
        <p class="text-center my-0">Gallery</p>
    </div>

    <!--container for cards-->
    <div class="h2 container-fluid rounded py-2">
        <div class="row row-cols-1 row-cols-lg-2 g-4">
            <div class="col" th:each="p : ${pets}">
                <div class="card h-100">
                    <div class="row g-0 h-100">
                        <div class="col-4">
                            <img th:src="@{'/img/' + ${p.photoUrl}}" th:alt="${p.name}"
                                 class="w-100 h-100 object-fit-cover rounded-start">
                        </div>
                        <div class="col-8">
                            <div class="card-body">
                                <div class="card-title">
                                    <p class="border-bottom border-3" style="border-color: coral;" th:text="${p.name}">Name</p>
                                </div>
                                <p class="card-text mb-1 small text-muted" th:text="${p.getAgeInYears}">2 years old</p>
                                <p class="card-text" th:text="${p.description}">Description</p>
                                <a th:href="@{/pet/{id}(id=${p.petId})}" class="btn btn-secondary btn-sm">Learn more</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${#lists.isEmpty(pets)}">
                <p class="text-center text-muted">No pets available right now.</p>
            </div>
        </div>
    </div>
    <!--container for login/registration buttons-->
    <div class="h3 container-fluid rounded d-flex flex-column">
        <div>
        <p class="fs-5 text-center">Want to adopt a friend today, create an account. Already have one then welcome back!</p>
        </div>
        <div class="container-fluid rounded d-flex justify-content-around py-2">
            <a class="btn btn-secondary" th:href="@{/login}">Login</a>
            <a class="btn btn-secondary" th:href="@{/registration}">Register</a>
        </div>
    </div>
    <!--container for kennel information-->
    <div class="h2 container-fluid rounded py-2">
        <h4 class="text-center">Our Locations</h4>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="k : ${kennels}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h5 class="card-title" th:text="'Kennel ID: ' + ${k.kennelId}">Kennel ID: 1</h5>
                        <p class="card-text mb-0" th:text="${k.location}">North Wing</p>
                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${#lists.isEmpty(kennels)}">
                <p class="text-center text-muted">No kennels to show yet.</p>
            </div>
        </div>
    </div>
    <block th:replace="~{partials :: scripts}"></block>
</body>

</html>
