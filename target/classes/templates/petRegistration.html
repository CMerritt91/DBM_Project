<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <title>Lone Star Pet Adoption</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="/static/main.css">
</head>

<body>
    <!--navbar-->
    <div class="navbar sticky-top">
        <img src="/static/img/LSPA_logo@1x.png" height="55px" width="55px">
        <a href="#" class="logo">Lone Star Pet Adoption</a>
        <button class="menu-toggle" aria-label="Toggle menu">☰</button>

        <ul class="nav-links">
            <li><a href="/templates/index.html">Home</a></li>
            <li><a href="/templates/gallery.html">Gallery</a></li>
            <li><a href="/templates/login.html">Login</a></li>
        </ul>
    </div>
    <div class="ghost"></div>
        <!--container for login-->
    <div class="container rounded">
        <div class="mt-5">
            <h1 class="formTitle text-center text-light">Animal Registration</h1>
        </div>
        <div class="container rounded formBody w-75 ">
            <h5 class="pt-2 text-center">Please complete all fields</h5>
            <!--change this for different objects-->
            <form class="container p-2" th:action="@{/user/create}" th:method="post" th:object="${user}">
                <div class="row">
                    <div class="col">
                        <label class="form-label pt-1" for="name">Pet Name</label>
                        <input class="form-control" type="text" id="name" name="name" th:field="*{name}">
                    </div>
                    <div class="col">
                        <label class="form-label pt-1" for="DOB">Date of Birth</label>
                        <input class="form-control" type="date" id="DOB" name="DOB" th:field="*{DOB}">
                    </div>
                </div>
               
                <label class="form-label pt-1" for="description">Description</label>
                <textarea class="form-control" rows="5" id="descritpion" name="description" th:field="*{description}"></textarea>

                <div class="row">
                    <div class="col">
                        <label class="form-label pt-1" for="inDate">Intake Date</label>
                        <input class="form-control" type="date" id="inDate" name="inDate" th:field="*{intakeDate}">
                    </div>
                    <div class="col">
                        <label class="form-label pt-1" for="sex">Sex</label>
                        <input class="form-control" type="text" id="sex" placeholder="M or F" name="sex" th:field="*{sex}">
                    </div>
                </div>
                
                <label class="form-label pt-1" for="photo">Photo URL</label>
                <input class="form-control" type="url" id="photo" name="photo" th:field="*{photo}">
                
                <label class="form-label pt-1" for="appStatus">Status</label>
                <input class="form-control" type="text" id="appStatus" placeholder="Waiting for Approval" disabled name="appStatus" th:field="*{appStatus}">
                
                <div class="row">
                    <div class="col">
                        <label class="form-label pt-1" for="kennel">Kennel</label>
                        <input class="form-control" type="int" id="kennel" placeholder="ex. 1,2,3" name="kennel" th:field="*{kennelId}">
                    </div>
                    <div class="col">
                        <label class="form-label pt-1" for="breed">Breed</label>
                        <input class="form-control" type="int" id="breed" placeholder="ex. 1,2,3" name="breed" th:field="*{breedId}">
                    </div>
                </div>
                <!--implement code to give list of kennels and breed with corresponding numbers-->

                <div class="pt-2 d-grid my-1">
                    <button type="submit" class="formBtn rounded border border-light">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>

    </script>

</body>
<footer></footer>

</html>
