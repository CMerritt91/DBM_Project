<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{partials :: head('Pet Registration')}"></head>

<body>
    <!--navbar-->
    <nav th:replace="~{partials :: nav}"></nav>
    <div class="ghost"></div>
        <!--container for login-->
    <div class="container rounded">
        <div class="mt-5">
            <h1 class="formTitle text-center text-light">Animal Registration</h1>
        </div>
        <div class="container rounded formBody w-75 ">
            <h5 class="pt-2 text-center">Please complete all fields</h5>
            <!--change this for different objects-->
            <form class="container p-2" th:action="@{/petRegistration}" th:method="post" th:object="${pet}">
                <div class="row">
                    <div class="col">
                        <label class="form-label pt-1" for="name">Pet Name</label>
                        <input class="form-control" type="text" id="name" name="name" th:field="*{name}">
                    </div>
                    <div class="col">
                        <label class="form-label pt-1" for="dob">Date of Birth</label>
                        <input class="form-control" type="date" id="dob" name="dob" th:field="*{dob}">
                    </div>
                </div>
               
                <label class="form-label pt-1" for="description">Description</label>
                <textarea class="form-control" rows="3" maxlength="500" id="descritpion" name="description" th:field="*{description}"></textarea>

                <div class="row">
                    <div class="col">
                        <label class="form-label pt-1" for="intakeDate">Intake Date</label>
                        <input class="form-control" type="date" id="intakeDate" name="intakeDate" th:field="*{intakeDate}">
                    </div>
                    <div class="col">
                        <label class="form-label pt-1" for="sex">Sex</label>
                        <input class="form-control" type="text" id="sex" placeholder="Male or Female" name="sex" th:field="*{sex}">
                    </div>
                </div>
                
                <label class="form-label pt-1" for="photo">Photo URL</label>
                <input class="form-control" type="text" id="photo" name="photo" th:field="*{photoUrl}">
                
                <label class="form-label pt-1" for="adoptionStatus">Status</label>
                <input class="form-control" type="text" id="adoptionStatus" name="adoptionStatus" th:field="*{adoptionStatus}">
                
                <div class="row">
                    <div class="col">
                        <label class="form-label pt-1" for="kennel">Kennel</label>
                        <select class="form-select mb-2" name="kennel" id="kennel" th:field="*{kennelId}">
                            <option th:each="k : ${kennels}" th:value="${k.kennelId}"
                                th:text="${'Kennel ' + k.kennelNumber + ' - ' + k.location}"></option>
                        </select>
                    </div>
                    <div class="col">
                        <label class="form-label pt-1" for="breed">Breed</label>
                        <select class="form-select mb-2" name="breed" id="breed" th:field="*{breedId}">
                            <option th:each="b : ${breeds}" th:value="${b.breedId}" th:text="${b.breedName}"></option>
                        </select>
                    </div>
                </div>
                <!--implement code to give list of kennels and breed with corresponding numbers-->

                <div class="pt-2 d-grid my-1">
                    <button type="submit" class="formBtn rounded border border-light">Add Pet</button>
                </div>
            </form>
        </div>
    </div>
    <div class="ghost"></div>
    <block th:replace="~{partials :: scripts}"></block>

</body>
<footer></footer>

</html>
